[package]
name = "wechat-file-dock-tauri"
version = "0.1.2"
description = "A Tauri migration shell for WeChat File Dock."
authors = ["tianrking"]
license = "MIT"
edition = "2021"

[lib]
name = "wechat_file_dock_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wechat-file-dock-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
